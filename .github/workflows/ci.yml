name: Web quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Enforce browser asset budgets
        run: |
          test "$(stat -c%s assets/app.js)" -le 3000000
          find maps/previews -type f -size +3M -print -quit | (! grep .)
      - name: Verify committed browser bundle
        run: git diff --exit-code -- assets
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
